name: daily-AMC-report

on:
  schedule:
    - cron: "0 16 * * *"  # 16:00 UTC daily (8am Los Angeles during standard time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute notebook and export HTML
        run: |
          mkdir -p build docs
          papermill notebooks/AMC_Scraper_5.ipynb build/report.executed.ipynb
          jupyter nbconvert --to html build/report.executed.ipynb --output docs/index.html --embed-images
          date -u > docs/last_run_utc.txt

      - name: Commit and push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/last_run_utc.txt
          git commit -m "Daily report refresh" || exit 0
          git push
