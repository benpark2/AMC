name: daily-AMC-report

on:
  schedule:
    - cron: "0 16 * * *" # 16:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Lets the notebook import scripts.movie_titles from the repository root.
  PYTHONPATH: ${{ github.workspace }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test generic title handling
        run: |
          python scripts/test_movie_titles.py
          python -m py_compile \
            scripts/movie_titles.py \
            scripts/patch_notebook_titles.py \
            scripts/finalize_posters.py

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Execute notebook and export HTML
        run: |
          mkdir -p build docs

          # Patch a temporary notebook copy. The production notebook stays
          # unchanged and the patch fails loudly if its structure changes.
          python scripts/patch_notebook_titles.py \
            notebooks/AMC_Scraper_5.ipynb \
            build/AMC_Scraper_5.patched.ipynb

          papermill \
            build/AMC_Scraper_5.patched.ipynb \
            build/report.executed.ipynb

          # Papermill stores notebook stdout as cell output, and nbconvert would
          # otherwise publish those diagnostic messages on the public webpage.
          # Keep the underlying debug HTML files and filtering behavior; remove
          # only these known informational log lines from the rendered report.
          python - <<'PY'
          import json
          from pathlib import Path

          notebook_path = Path("build/report.executed.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))

          hidden_prefixes = (
              "[INFO] Saved AMC debug HTML to ",
              "[INFO] Dropping non-movie AMC inventory:",
          )

          removed = 0

          for cell in notebook.get("cells", []):
              outputs = cell.get("outputs")
              if not isinstance(outputs, list):
                  continue

              kept_outputs = []

              for output in outputs:
                  if output.get("output_type") != "stream":
                      kept_outputs.append(output)
                      continue

                  text_value = output.get("text", "")
                  if isinstance(text_value, list):
                      text_value = "".join(text_value)
                  else:
                      text_value = str(text_value)

                  kept_lines = []
                  for line in text_value.splitlines(keepends=True):
                      if line.lstrip().startswith(hidden_prefixes):
                          removed += 1
                      else:
                          kept_lines.append(line)

                  cleaned = "".join(kept_lines)
                  if cleaned:
                      output["text"] = cleaned
                      kept_outputs.append(output)

              cell["outputs"] = kept_outputs

          notebook_path.write_text(
              json.dumps(notebook, ensure_ascii=False, indent=1) + "\n",
              encoding="utf-8",
          )

          print(f"[INFO] Removed {removed} diagnostic line(s) from public report output")
          PY

          jupyter nbconvert \
            --to html \
            build/report.executed.ipynb \
            --template lab \
            --output index.html \
            --output-dir docs \
            --embed-images \
            --no-input \
            --HTMLExporter.exclude_output_prompt=True

          # Existing layout/planner/Wikipedia pass.
          python scripts/postprocess_report.py

          # Generic canonical-title Wikipedia retry for placeholder images.
          # No movie-specific overrides or non-Wikipedia poster scraping.
          python scripts/finalize_posters.py

          date -u +"%Y-%m-%dT%H:%M:%SZ" > docs/last_run_utc.txt

          test -f docs/index.html
          ls -la docs

      - name: Make HTML mobile-friendly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("docs/index.html")
          html = p.read_text(encoding="utf-8")

          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1" />\n'
          css = r"""<style>
          /* Mobile fixes (added by CI) */
          img, svg, video, canvas { max-width: 100%; height: auto; }

          @media (max-width: 900px) {
            .jp-OutputArea-child {
              display: block !important;
              overflow-x: auto !important;
              width: 100% !important;
            }

            .jp-RenderedHTMLCommon,
            .jp-OutputArea-output,
            .output_area,
            .output_subarea {
              overflow-x: auto !important;
              -webkit-overflow-scrolling: touch;
              max-width: 100% !important;
            }

            table,
            table.dataframe {
              display: block;
              overflow-x: auto;
              max-width: 100%;
              -webkit-overflow-scrolling: touch;
            }

            pre {
              overflow-x: auto;
              -webkit-overflow-scrolling: touch;
            }
          }
          </style>
          """

          insert = ""
          if 'name="viewport"' not in html:
              insert += viewport
          if "Mobile fixes (added by CI)" not in html:
              insert += css + "\n"

          if insert and "</head>" in html:
              html = html.replace("</head>", insert + "</head>", 1)

          p.write_text(html, encoding="utf-8")
          PY

      - name: Commit and push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A docs
          git commit -m "Daily report refresh" || exit 0
          git push

      - name: Upload AMC debug HTML
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amc-debug-html
          path: build/amc_debug/
          if-no-files-found: ignore
